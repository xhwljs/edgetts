<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数学乐园 - 快乐学习</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="home-page" class="page active">
        <div class="header">
            <h1 class="title">🧮 数学乐园</h1>
            <div class="user-info">
                <span class="coins">💰 0</span>
                <span class="level">等级 1</span>
            </div>
        </div>
        
        <div class="streak-container"></div>
        
        <div class="cards-section">
            <div class="card-group-title">🎯 练习模式</div>
            <div class="practice-cards">
                <div class="practice-card custom-practice-card" onclick="showPage('custom-practice')">
                    <div class="card-icon">✏️</div>
                    <div class="card-title">自定义练习</div>
                    <div class="card-desc">选择难度和题型</div>
                </div>
                <div class="practice-card random-practice-card" onclick="showPage('random-practice')">
                    <div class="card-icon">🎲</div>
                    <div class="card-title">随机练习</div>
                    <div class="card-desc">混合题型挑战</div>
                </div>
                <div class="practice-card challenge-card" onclick="showPage('challenge')">
                    <div class="card-icon">🏆</div>
                    <div class="card-title">挑战模式</div>
                    <div class="card-desc">闯关升级</div>
                </div>
                <div class="practice-card timed-card" onclick="showTimedChallenge()">
                    <div class="card-icon">⏱️</div>
                    <div class="card-title">限时挑战</div>
                    <div class="card-desc">速度大比拼</div>
                </div>
            </div>
        </div>
        
        <div class="cards-section">
            <div class="card-group-title">📋 每日任务</div>
            <div class="tasks-card">
                <div class="tasks-list"></div>
            </div>
        </div>
        
        <div class="cards-section">
            <div class="card-group-title">🔧 快捷工具</div>
            <div class="tools-grid">
                <div class="tool-card" onclick="showPage('wrong-list')">
                    <div class="tool-icon">📝</div>
                    <div class="tool-name">错题本</div>
                </div>
                <div class="tool-card" onclick="showPage('study-history')">
                    <div class="tool-icon">📊</div>
                    <div class="tool-name">学习记录</div>
                </div>
                <div class="tool-card" onclick="showPage('medals')">
                    <div class="tool-icon">🏅</div>
                    <div class="tool-name">我的勋章</div>
                </div>
                <div class="tool-card" onclick="showPage('shop')">
                    <div class="tool-icon">🛒</div>
                    <div class="tool-name">主题商店</div>
                </div>
                <div class="tool-card" onclick="showPage('parent-mode')">
                    <div class="tool-icon">👨‍👩‍👧</div>
                    <div class="tool-name">家长模式</div>
                </div>
            </div>
        </div>
    </div>

        <div id="custom-practice" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>自定义练习</h2>
            </div>
            
            <div class="practice-config">
                <div class="section">
                    <h3>选择题型</h3>
                    <div class="options" id="type-options">
                        <button class="option-btn active" onclick="selectType('oral')">🗣️ 口算题</button>
                        <button class="option-btn" onclick="selectType('fill')">✏️ 填空题</button>
                        <button class="option-btn" onclick="selectType('multi')">🔢 连加连减</button>
                        <button class="option-btn" onclick="selectType('multiply')">✖️ 乘法练习</button>
                        <button class="option-btn" onclick="selectType('compare')">⚖️ 比大小</button>
                    </div>
                </div>
                
                <div class="section">
                    <h3>选择难度</h3>
                    <div class="options" id="level-options">
                        <button class="option-btn active" onclick="selectLevel(1)">🌱 初级</button>
                        <button class="option-btn" onclick="selectLevel(2)">🌿 中级</button>
                        <button class="option-btn" onclick="selectLevel(3)">🌳 高级</button>
                        <button class="option-btn" onclick="selectLevel(4)">🌲 专家</button>
                        <button class="option-btn" onclick="selectLevel('custom')">🎨 自定义</button>
                    </div>
                </div>
                
                <div class="section" id="custom-range-section" style="display: none;">
                    <h3>设置数字范围</h3>
                    <div class="custom-range-wrapper">
                        <div class="custom-range-item">
                            <label>最小</label>
                            <input type="number" id="custom-min" value="0" min="0" max="1000">
                        </div>
                        <span class="range-separator">~</span>
                        <div class="custom-range-item">
                            <label>最大</label>
                            <input type="number" id="custom-max" value="20" min="1" max="1000">
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h3>选择运算类型</h3>
                    <div class="options" id="op-options">
                        <button class="option-btn active" onclick="selectOp('add')">➕ 加法</button>
                        <button class="option-btn" onclick="selectOp('sub')">➖ 减法</button>
                        <button class="option-btn" onclick="selectOp('mix')">➕➖ 混合</button>
                    </div>
                </div>
                
                <div class="section">
                    <h3>题目数量</h3>
                    <div class="options" id="count-options">
                        <button class="option-btn" onclick="selectCount(5)">5 题</button>
                        <button class="option-btn active" onclick="selectCount(10)">10 题</button>
                        <button class="option-btn" onclick="selectCount(20)">20 题</button>
                        <button class="option-btn" onclick="selectCount(30)">30 题</button>
                    </div>
                </div>
                
                <button class="start-btn" onclick="startPractice()">🚀 开始练习</button>
            </div>
        </div>

        <div id="random-practice" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>随机混合练习</h2>
            </div>
            
            <div class="practice-config">
                <div class="section">
                    <h3>选择难度</h3>
                    <div class="options" id="random-level-options">
                        <button class="option-btn active" onclick="selectLevel(1)">🌱 初级</button>
                        <button class="option-btn" onclick="selectLevel(2)">🌿 中级</button>
                        <button class="option-btn" onclick="selectLevel(3)">🌳 高级</button>
                        <button class="option-btn" onclick="selectLevel(4)">🌲 专家</button>
                    </div>
                </div>
                
                <div class="section">
                    <h3>题目数量</h3>
                    <div class="options" id="random-count-options">
                        <button class="option-btn" onclick="selectCount(5)">5 题</button>
                        <button class="option-btn active" onclick="selectCount(10)">10 题</button>
                        <button class="option-btn" onclick="selectCount(20)">20 题</button>
                    </div>
                </div>
                
                <button class="start-btn" onclick="startRandomPractice()">🎲 开始随机练习</button>
            </div>
        </div>

        <div id="challenge" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>🏆 挑战模式</h2>
            </div>
            <div class="challenge-groups"></div>
        </div>

        <div id="practice-page" class="page">
            <div class="quiz-top">
                <button class="quiz-back" onclick="confirmExit()">← 退出</button>
                <div class="quiz-info">
                    <span id="quiz-progress">1/10</span>
                    <span id="quiz-timer">0:00</span>
                </div>
                <button id="quiz-sound" class="quiz-sound" onclick="toggleSound()">🔊</button>
            </div>
            
            <div class="quiz-question">
                <div class="question-area"></div>
            </div>
            
            <div class="quiz-feedback"></div>
            
            <div class="quiz-answer">
                <div class="answer-show">
                    <span id="answer-text">?</span>
                </div>
            </div>
            
            <div class="quiz-keypad">
                <div class="key-row">
                    <button class="key" onclick="inputNumber(1)">1</button>
                    <button class="key" onclick="inputNumber(2)">2</button>
                    <button class="key" onclick="inputNumber(3)">3</button>
                </div>
                <div class="key-row">
                    <button class="key" onclick="inputNumber(4)">4</button>
                    <button class="key" onclick="inputNumber(5)">5</button>
                    <button class="key" onclick="inputNumber(6)">6</button>
                </div>
                <div class="key-row">
                    <button class="key" onclick="inputNumber(7)">7</button>
                    <button class="key" onclick="inputNumber(8)">8</button>
                    <button class="key" onclick="inputNumber(9)">9</button>
                </div>
                <div class="key-row">
                    <button class="key key-clear" onclick="clearInput()">清除</button>
                    <button class="key" onclick="inputNumber(0)">0</button>
                    <button class="key key-submit" onclick="submitAnswer()">确定</button>
                </div>
            </div>
            
            <div class="compare-buttons" style="display: none;">
                <button class="compare-btn" onclick="inputCompare('>')">&gt;</button>
                <button class="compare-btn" onclick="inputCompare('<')">&lt;</button>
            </div>
        </div>

        <div id="result-page" class="page"></div>

        <div id="wrong-list" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>📝 错题本</h2>
            </div>
            <div class="wrong-content"></div>
        </div>

        <div id="medals" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>🏅 我的勋章</h2>
            </div>
            <div class="medals-content"></div>
        </div>

        <div id="achievement-modal" class="modal">
            <div class="modal-content achievement-modal">
                <div class="achievement-icon">🏆</div>
                <h3>成就解锁！</h3>
                <p id="achievement-name"></p>
                <p id="achievement-desc"></p>
                <button class="modal-btn" onclick="closeAchievementModal()">太棒了！</button>
            </div>
        </div>

        <div id="parent-mode" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>👨‍👩‍👧 家长模式</h2>
            </div>
            <div class="parent-content"></div>
        </div>

        <div id="shop" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>🛒 主题商店</h2>
                <span class="coins">💰 0</span>
            </div>
            <div class="shop-content"></div>
        </div>

        <div id="study-history" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>📊 学习记录</h2>
            </div>
            <div class="history-content"></div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/modules/oral.js"></script>
    <script src="js/modules/fill.js"></script>
    <script src="js/modules/multi.js"></script>
    <script src="js/modules/multiplication.js"></script>
    <script src="js/modules/compare.js"></script>
    <script src="js/modules/challenge.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
