<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数学乐园 - 快乐学习</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="home-page" class="page active">
        <div class="header">
            <h1 class="title">🧮 数学乐园</h1>
            <div class="user-info">
                <span class="coins">💰 0</span>
                <span class="level">等级 1</span>
            </div>
        </div>
        
        <div class="streak-container"></div>
        
        <div class="main-menu">
            <button class="menu-btn custom-practice" onclick="showPage('custom-practice')">
                <span class="btn-icon">✏️</span>
                <span class="btn-text">自定义练习</span>
            </button>
            
            <button class="menu-btn random-practice" onclick="showPage('random-practice')">
                <span class="btn-icon">🎲</span>
                <span class="btn-text">随机混合练习</span>
            </button>
            
            <button class="menu-btn challenge-mode" onclick="showPage('challenge')">
                <span class="btn-icon">🏆</span>
                <span class="btn-text">挑战模式</span>
            </button>
        </div>
        
        <div class="daily-tasks">
            <h3>📋 每日任务</h3>
            <div class="tasks-list"></div>
        </div>
        
        <div class="quick-actions">
            <button class="action-btn" onclick="showPage('wrong-list')">
                <span>📝 错题本</span>
            </button>
            <button class="action-btn" onclick="showPage('medals')">
                <span>🏅 我的勋章</span>
            </button>
            <button class="action-btn" onclick="showPage('shop')">
                <span>🛒 主题商店</span>
            </button>
            <button class="action-btn" onclick="showPage('parent-mode')">
                <span>👨‍👩‍👧 家长模式</span>
            </button>
        </div>
    </div>

        <div id="custom-practice" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>自定义练习</h2>
            </div>
            
            <div class="practice-config">
                <div class="section">
                    <h3>选择题型</h3>
                    <div class="options" id="type-options">
                        <button class="option-btn active" onclick="selectType('oral')">🗣️ 口算题</button>
                        <button class="option-btn" onclick="selectType('fill')">✏️ 填空题</button>
                        <button class="option-btn" onclick="selectType('multi')">🔢 连加连减</button>
                        <button class="option-btn" onclick="selectType('compare')">⚖️ 比大小</button>
                    </div>
                </div>
                
                <div class="section">
                    <h3>选择难度</h3>
                    <div class="options" id="level-options">
                        <button class="option-btn active" onclick="selectLevel(1)">🌱 0-10</button>
                        <button class="option-btn" onclick="selectLevel(2)">🌿 0-20</button>
                        <button class="option-btn" onclick="selectLevel(3)">🌳 0-50</button>
                        <button class="option-btn" onclick="selectLevel(4)">🌲 0-100</button>
                    </div>
                </div>
                
                <div class="section">
                    <h3>选择运算类型</h3>
                    <div class="options" id="op-options">
                        <button class="option-btn active" onclick="selectOp('add')">➕ 加法</button>
                        <button class="option-btn" onclick="selectOp('sub')">➖ 减法</button>
                        <button class="option-btn" onclick="selectOp('mix')">➕➖ 混合</button>
                    </div>
                </div>
                
                <div class="section">
                    <h3>题目数量</h3>
                    <div class="options" id="count-options">
                        <button class="option-btn" onclick="selectCount(5)">5 题</button>
                        <button class="option-btn active" onclick="selectCount(10)">10 题</button>
                        <button class="option-btn" onclick="selectCount(20)">20 题</button>
                        <button class="option-btn" onclick="selectCount(30)">30 题</button>
                    </div>
                </div>
                
                <button class="start-btn" onclick="startPractice()">🚀 开始练习</button>
            </div>
        </div>

        <div id="random-practice" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>随机混合练习</h2>
            </div>
            
            <div class="practice-config">
                <div class="section">
                    <h3>选择难度</h3>
                    <div class="options" id="random-level-options">
                        <button class="option-btn active" onclick="selectLevel(1)">🌱 0-10</button>
                        <button class="option-btn" onclick="selectLevel(2)">🌿 0-20</button>
                        <button class="option-btn" onclick="selectLevel(3)">🌳 0-50</button>
                        <button class="option-btn" onclick="selectLevel(4)">🌲 0-100</button>
                    </div>
                </div>
                
                <div class="section">
                    <h3>题目数量</h3>
                    <div class="options" id="random-count-options">
                        <button class="option-btn" onclick="selectCount(5)">5 题</button>
                        <button class="option-btn active" onclick="selectCount(10)">10 题</button>
                        <button class="option-btn" onclick="selectCount(20)">20 题</button>
                    </div>
                </div>
                
                <button class="start-btn" onclick="startRandomPractice()">🎲 开始随机练习</button>
            </div>
        </div>

        <div id="challenge" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>🏆 挑战模式</h2>
            </div>
            <div class="challenge-groups"></div>
        </div>

        <div id="practice-page" class="page">
            <div class="header">
                <button class="back-btn" onclick="confirmExit()">← 退出</button>
                <div class="progress"><span>1/10</span></div>
                <div class="timer">⏱️ <span id="timer-display">0:00</span></div>
                <button id="sound-btn" class="sound-btn" onclick="toggleSound()">🔊</button>
            </div>
            
            <div class="question-area"></div>
            
            <div class="feedback"></div>
            
            <div class="answer-keypad">
                <div class="keypad-row">
                    <button class="keypad-btn" onclick="inputNumber(1)">1</button>
                    <button class="keypad-btn" onclick="inputNumber(2)">2</button>
                    <button class="keypad-btn" onclick="inputNumber(3)">3</button>
                </div>
                <div class="keypad-row">
                    <button class="keypad-btn" onclick="inputNumber(4)">4</button>
                    <button class="keypad-btn" onclick="inputNumber(5)">5</button>
                    <button class="keypad-btn" onclick="inputNumber(6)">6</button>
                </div>
                <div class="keypad-row">
                    <button class="keypad-btn" onclick="inputNumber(7)">7</button>
                    <button class="keypad-btn" onclick="inputNumber(8)">8</button>
                    <button class="keypad-btn" onclick="inputNumber(9)">9</button>
                </div>
                <div class="keypad-row">
                    <button class="keypad-btn clear-btn" onclick="clearInput()">清除</button>
                    <button class="keypad-btn" onclick="inputNumber(0)">0</button>
                    <button class="keypad-btn submit-btn" onclick="submitAnswer()">确定</button>
                </div>
            </div>
            
            <div class="compare-buttons" style="display: none;">
                <button class="compare-btn" onclick="inputCompare('>')">&gt;</button>
                <button class="compare-btn" onclick="inputCompare('<')">&lt;</button>
            </div>
        </div>

        <div id="result-page" class="page"></div>

        <div id="wrong-list" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>📝 错题本</h2>
            </div>
            <div class="wrong-content"></div>
        </div>

        <div id="medals" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>🏅 我的勋章</h2>
            </div>
            <div class="medals-content"></div>
        </div>

        <div id="achievement-modal" class="modal">
            <div class="modal-content achievement-modal">
                <div class="achievement-icon">🏆</div>
                <h3>成就解锁！</h3>
                <p id="achievement-name"></p>
                <p id="achievement-desc"></p>
                <button class="modal-btn" onclick="closeAchievementModal()">太棒了！</button>
            </div>
        </div>

        <div id="parent-mode" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>👨‍👩‍👧 家长模式</h2>
            </div>
            <div class="parent-content"></div>
        </div>

        <div id="shop" class="page">
            <div class="header">
                <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
                <h2>🛒 主题商店</h2>
                <span class="coins">💰 0</span>
            </div>
            <div class="shop-content"></div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/modules/oral.js"></script>
    <script src="js/modules/fill.js"></script>
    <script src="js/modules/multi.js"></script>
    <script src="js/modules/compare.js"></script>
    <script src="js/modules/challenge.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
