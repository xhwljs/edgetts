name: Android Build

# 触发条件：推送到 main/master 分支、PR、以及手动触发
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Gradle 8.2
        id: gradle-setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 验证 Gradle 版本
        run: gradle --version

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34,build-tools;34.0.0'

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 编译 Release APK（未签名）
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TestApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TestApp-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
